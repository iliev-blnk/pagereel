<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#fff}canvas{display:block}</style>
<canvas id="c" width="480" height="120"></canvas>
<script>
  const g = document.getElementById('c').getContext('2d')
  function frame() {
    g.fillStyle = '#fff'
    g.fillRect(0, 0, 480, 120)
    g.fillStyle = '#f00'
    g.fillRect((performance.now() / 1000) * 100, 40, 40, 40)
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
</script>
