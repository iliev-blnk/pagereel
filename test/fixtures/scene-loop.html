<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#fff}#b{position:absolute;top:40px;width:40px;height:40px;background:#f00}</style>
<div id="b"></div>
<script>
  window.pagereel = {
    duration: 2, fps: 30, width: 480, height: 120, loop: true,
    seek(t) {
      document.getElementById('b').style.left = 200 + 150 * Math.sin((2 * Math.PI * t) / 2) + 'px'
    },
  }
</script>
