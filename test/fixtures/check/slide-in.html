<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#111;color:#fff;font:700 72px/1.2 sans-serif}
#sq{position:absolute;top:300px;left:340px;width:400px;height:400px;background:#2f7cf6}
.t{position:absolute;left:100px;top:800px;margin:0;font-size:72px}</style>
<div id="sq"></div><h1 class="t" id="a">Offline captions</h1><h1 class="t" id="b">Rising line</h1>
<script>
const sq = document.getElementById("sq")
window.pagereel = { duration: 3, fps: 30, width: 1080, height: 1920,
  seek(t) {
    sq.style.left = 340 + 300 * Math.sin(t * 2.5) + 'px'
    const p = Math.min(t / 0.5, 1)
    document.getElementById('a').style.left = -900 + 1000 * p + 'px'
    document.getElementById('b').style.top = 1900 - 700 * (1 - (1 - p) ** 3) + 'px'
  } }
</script>
