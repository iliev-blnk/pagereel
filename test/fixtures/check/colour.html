<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#6a6a6a;color:#fff;font:700 72px/1.2 sans-serif}
#sq{position:absolute;top:300px;left:340px;width:400px;height:400px;background:#2f7cf6}</style>
<div id="sq"></div>
<script>
const sq = document.getElementById("sq")
window.pagereel = { duration: 3, fps: 30, width: 1080, height: 1920,
  seek(t) {
    sq.style.left = 340 + 300 * Math.sin(t * 2.5) + 'px'
  } }
</script>
